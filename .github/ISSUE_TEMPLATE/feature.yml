name: Feature request
description: A capability, a source or a change the Affinity plugin should make.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        A new capability starts in the manifest and needs a handler, tests and a recorded fixture. Read AGENTS.md
        before you open the pull request. A pass-through tool is Affinity's own: it is classified in `methods`, never
        proxied by this plugin.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of capability
      options:
        - A plugin read method
        - A plugin write method
        - An events source
        - A pass-through Affinity tool's class
        - An account mechanism or profile field
        - Documentation or layout
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What a person cannot do today, and why the plugin is the right owner.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: The method or source, its class, the Affinity operations it needs, and what its answer looks like.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and confirmation
      description: For a write, say what it reaches and how it is confirmed (an ask, or an action grant). For a read, say what it reads.
    validations:
      required: false

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - name: Bundle the release tar
        run: tar czf "affinity-plugin-${GITHUB_REF_NAME}.tar.gz" dist skills assets package.json README.md LICENSE
      - name: Checksums
        run: sha256sum ./*.tgz ./*.tar.gz > SHA256SUMS
      - name: Conformance report
        run: npx plugin-kit conformance --json > conformance.json
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes ./*.tgz ./*.tar.gz SHA256SUMS conformance.json
